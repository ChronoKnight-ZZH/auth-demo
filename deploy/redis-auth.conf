# /etc/redis/redis-auth.conf（或追加到 redis.conf）
# 会话是数据不是缓存：禁止淘汰，开启 AOF，只监听回环。
bind 127.0.0.1
protected-mode yes
port 6379
requirepass CHANGE_ME_STRONG_RANDOM

maxmemory 256mb
maxmemory-policy noeviction

appendonly yes
appendfsync everysec
# 不依赖 RDB；AOF 已足够，快照可选
save ""

# 连接数：Node pool 与 SSE 缓冲都走 Redis，给足余量
maxclients 512
