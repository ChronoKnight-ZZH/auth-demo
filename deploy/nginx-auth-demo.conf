# auth-demo Nginx 站点配置
# 对应方案 §6.5.2：TLS 终结、HTTP→HTTPS、静态资源长缓存、登录粗限流
#
# 用法：
#   1) 域名解析到本机
#   2) cp auth-demo.conf /etc/nginx/conf.d/
#   3) certbot --nginx -d auth.example.com --agree-tos -m ops@example.com --redirect
#      （certbot 会自动补全 ssl_certificate 等指令并启用 redirect）

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    # certbot --redirect 会自动改为 301 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.example.com;

    # 由 certbot 写入
    # ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 登录体只有数百字节，16k 足够
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # 页面无外链资源，CSP 可收紧
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    # 登录接口：粗限流第一道（应用层还有 account/IP 精确计数）
    location = /auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }

    # 静态资源：指纹文件名 + 长缓存，避免 5 Mbps 被首屏并发打满
    location /assets/ {
        alias /opt/auth-demo/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }
}