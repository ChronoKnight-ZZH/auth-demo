# api.shunkai-dg.cn —— auth-demo（登录 / BFF / 会话 / 附件 / 语音）
#
# 用法：
#   1) auth-demo 下 npm run build，产物 rsync 到 /opt/auth-demo
#   2) cp nginx-api.conf /etc/nginx/conf.d/
#   3) certbot --nginx -d api.shunkai-dg.cn --agree-tos -m ops@example.com --redirect
#
# CORS 由应用层 CORS_ORIGINS 控制，这里不要重复加 Access-Control-* 头。

limit_req_zone $binary_remote_addr zone=api_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.shunkai-dg.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shunkai-dg.cn;

    # 由 certbot 写入
    # ssl_certificate     /etc/letsencrypt/live/api.shunkai-dg.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.shunkai-dg.cn/privkey.pem;

    # CentOS 7 自带 OpenSSL 1.0.2 不支持 TLSv1.3；升级 OpenSSL 后可加回 TLSv1.3
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # 默认收紧；/v1 下按路由放宽（聊天 4MB、ASR 8MB、附件 64MB）
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # 登录：Nginx 粗限流；应用层还有 account/IP 精确计数
    location = /auth/login {
        limit_req zone=api_login burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    # 能力票据在 query 中，禁止把签名 URL 写进访问日志
    location /v1/files/content {
        access_log off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    # BFF：附件/语音流式转发，SSE 关闭缓冲逐帧下发
    location /v1/ {
        client_max_body_size 80m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    # 登录 / 改密 / 健康检查
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log warn;
}
